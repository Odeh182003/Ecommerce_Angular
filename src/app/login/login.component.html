<!DOCTYPE html>
<html>
<head>
	<title>Slide Navbar</title>
	<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>
<body>
	<div class="main">  	
		<input type="checkbox" id="chk" aria-hidden="true">

		<div class="signup">
			<form>
				<label for="chk" aria-hidden="true">Sign up</label>
				<input type="text" placeholder="User name" required [(ngModel)]="signupObj.name" name="name">
				<input type="email" placeholder="Email" required [(ngModel)]="signupObj.email" name="email">
				<input type="password" placeholder="Password" required [(ngModel)]="signupObj.password" name="password">
				<button (click)="onSignup()">Sign up</button>
			</form>
		</div>

		<div class="login">
			<form>
				<label for="chk" aria-hidden="true">Login</label>
				<input type="text" placeholder="User name" required [(ngModel)]="loginObj.name" name="name">
				<input type="password" placeholder="Password" required [(ngModel)]="loginObj.password" name="password">
				<button (click)="onLogin()">Login</button>
			</form>
		</div>
	</div>
</body>
</html>
